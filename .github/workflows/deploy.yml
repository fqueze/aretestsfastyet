# Builds the dashboards and publishes them to GitHub Pages on push to `main`.
#
# The published site is a *merge*: the pages rewritten onto `lib/` are built
# from `site/`, and the ones never migrated are copied verbatim. What goes where
# is `tools/assemble-site.ts`, which also refuses to hand over an artifact whose
# pages reference files that are not in it. See `docs/DEPLOY.md`.
#
# Nothing here names a repository: the workflow publishes whichever one it runs
# in. On mozilla/aretestsfastyet that is tests.firefox.dev; on the fork it is
# fqueze.github.io/aretestsfastyet, which is the staging instance and where this
# was proven first. Both need Pages set to the GitHub Actions source once, and
# both have it.
#
# ---------------------------------------------------------------------------
# ROLLBACK
# ---------------------------------------------------------------------------
#
# Two options, cheapest first.
#
# 1. **Re-publish a previous good run.** Actions → this workflow → the run you
#    want → "Re-run all jobs". It rebuilds from that commit. Nothing here reads
#    mutable state, so a re-run of a green commit reproduces it.
#
# 2. **Revert and push.** `git revert <sha>` and push to whichever remote serves
#    the broken site — pushing to the fork does not fix tests.firefox.dev. That
#    re-runs this workflow and republishes. Use it when the bad commit is a
#    source change rather than a deploy problem.
#
# If the deploy itself is what is broken — the site is empty, or serving the
# wrong tree — turn Pages off (Settings → Pages → Source: None) rather than
# fighting it, then fix and re-enable. An empty artifact cannot be published by
# accident: the assembly asserts its own output and fails the job first.
#
# ---------------------------------------------------------------------------
# IF A DEPLOY HANGS
# ---------------------------------------------------------------------------
#
# Publishing an artifact needs Settings → Pages → Source: **GitHub Actions**,
# which a workflow cannot set for itself. Both repositories have it; if someone
# switches one back to a branch source, `deploy-pages` fails outright, because
# the create-deployment call is rejected.
#
# A different symptom is not a configuration problem: if the deployment *is*
# created and returns an ID, then sits at `deployment_queued` or
# `deployment_in_progress` until the 600 s timeout, the artifact was accepted
# and GitHub has not processed it. That happened on 2026-08-06 across three
# attempts and was a Pages incident affecting many repositories, with the status
# page reporting all systems operational throughout. It cleared on its own.
# Retrying does not help while it lasts, and nothing in this repository is at
# fault. Check https://github.com/orgs/community/discussions before debugging.

name: Deploy

on:
  push:
    branches: [main]
  # So a failed deploy can be retried, and so the first run can be triggered
  # once the Pages source has been switched over.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-uploaded
# artifact is worse than a slightly stale site. Queued runs collapse to the
# newest, since only the newest would win anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Every gate runs before anything is uploaded, and each is a separate step
      # so a failure names itself in the run summary. `npm test` includes
      # check-bundle, which fails on a stale committed dist/fx-tests.js.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # A fresh directory, never a `dist-site/` left over from a previous run:
      # a stale file that no longer exists in the sources would otherwise be
      # published indefinitely with nothing reporting it. The runner's workspace
      # is clean, but naming the output explicitly is what makes that a property
      # of the workflow rather than of the runner.
      - name: Build the migrated pages
        run: npm run pages
        env:
          FX_PAGES_BUILD_OUT: ${{ runner.temp }}/site

      # Merges in the unmigrated pages, writes `.nojekyll`, then
      # re-reads the finished tree and exits non-zero unless every page and
      # every file any page references is present. A copy step that silently
      # copied nothing fails here instead of publishing a site of 404s.
      - name: Assemble and verify the site
        run: node --experimental-strip-types tools/assemble-site.ts
        env:
          FX_SITE_OUT: ${{ runner.temp }}/site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    # A separate job so that `needs` is the only thing that can start a deploy:
    # every gate above belongs to `build`, and none of them can be skipped into.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
